name: Deploy staging

on:
  workflow_call:
    inputs:
      image_tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag semântica da imagem publicada, sem o prefixo v (ex.: 2.1.5)"
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  staging:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Normalizar nome da imagem
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Validar versão e preparar Compose
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Informe uma versão no formato X.Y.Z, sem o prefixo v."
            exit 1
          fi
          echo "APP_IMAGE=$IMAGE_NAME:$IMAGE_TAG" >> "$GITHUB_ENV"

      - name: Entrar no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Iniciar imagem no ambiente temporário
        run: docker compose -f docker-compose.staging.yml up --detach --pull always

      - name: Verificar aplicação
        run: |
          for attempt in {1..15}; do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --header 'Content-Type: application/json' \
              --data '{"email":"staging-check@example.invalid","senhaMestra":"invalid-test-password"}' \
              http://127.0.0.1:3000/api/auth/login || true)
            if [[ "$status" == "401" ]]; then
              echo "API e banco de homologação responderam como esperado."
              exit 0
            fi
            sleep 2
          done
          docker compose -f docker-compose.staging.yml logs app
          exit 1

      - name: Encerrar ambiente temporário
        if: always()
        run: docker compose -f docker-compose.staging.yml down --volumes --remove-orphans